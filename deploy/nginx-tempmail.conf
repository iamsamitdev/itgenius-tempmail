# ITGenius Temp Mail - tm.itgenius.co.th -> node 127.0.0.1:3010 (systemd: tempmail.service)
# Certificate: lego, /etc/tempmail-ssl (renewed by /etc/cron.d/tempmail-cert)
server {
	listen YOUR_SERVER_IP:80;
	server_name tm.itgenius.co.th;
	location ^~ /.well-known/acme-challenge/ { root /var/www/tempmail-acme; default_type text/plain; }
	location / { return 301 https://$host$request_uri; }
}
server {
	listen YOUR_SERVER_IP:443 ssl;
	http2 on;
	server_name tm.itgenius.co.th;
	ssl_certificate /etc/tempmail-ssl/certificates/tm.itgenius.co.th.crt;
	ssl_certificate_key /etc/tempmail-ssl/certificates/tm.itgenius.co.th.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	client_max_body_size 64k;
	access_log /var/log/nginx/tempmail.access.log;
	error_log /var/log/nginx/tempmail.error.log;

	location ^~ /.well-known/acme-challenge/ { root /var/www/tempmail-acme; default_type text/plain; }

	location ~ ^/(api/)?(events|\.well-known/mercure)$ {
		proxy_pass http://127.0.0.1:3010;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Connection "";
		proxy_set_header X-TempMail-Client $remote_addr;
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
	location / {
		proxy_pass http://127.0.0.1:3010;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Connection "";
		proxy_set_header X-TempMail-Client $remote_addr;
		proxy_read_timeout 60s;
	}
}
